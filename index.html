<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080A" />
    <title>moodscreen</title>
    <meta
      name="description"
      content="Say what you're on. Post it anywhere. It stays live."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Self-hosted, subset woff2. There is deliberately no Google Fonts link
      here and there must never be one: html-to-image cannot embed a
      cross-origin stylesheet, so a CDN face silently becomes Arial in the
      exported PNG. See src/styles/fonts.css and scripts/build-fonts.mjs.
    -->
    <link
      rel="preload"
      href="/fonts/Switzer-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Switzer-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Open Graph / Twitter — per-user images are a server-rendered route, not shipped yet -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="moodscreen — what are you on right now?" />
    <meta
      property="og:description"
      content="Say what you're on. Post it anywhere. It stays live."
    />
    <meta property="og:url" content="https://moodscreen.live/" />
    <meta property="og:site_name" content="moodscreen" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="moodscreen — what are you on right now?" />
    <meta
      name="twitter:description"
      content="Say what you're on. Post it anywhere. It stays live."
    />
  </head>
  <body class="min-h-dvh bg-canvas text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
