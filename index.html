<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>moodscreen</title>
    <meta
      name="description"
      content="Your status on one screen — share how you feel and what you're on."
    />
    <!-- Open Graph / Twitter — set og:url and og:image to your production absolute URLs when you deploy -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="moodscreen — your status on one screen" />
    <meta
      property="og:description"
      content="A calm, screenshot-ready card for your current mood and link."
    />
    <meta property="og:url" content="https://moodscreen.live/" />
    <!-- Add og:image (absolute URL to a 1200×630 PNG) when you host a preview image -->
    <meta property="og:site_name" content="moodscreen" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="moodscreen — your status on one screen" />
    <meta
      name="twitter:description"
      content="A calm, screenshot-ready card for your current mood and link."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-dvh bg-surface text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
